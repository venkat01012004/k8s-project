{% extends "base.html" %}
{% block title %}Error {{ code }} — JobNest{% endblock %}

{% block content %}
<div class="error-page">
  <div class="code">{{ code }}</div>
  <h2>{{ 'Page Not Found' if code == 404 else 'Something Went Wrong' }}</h2>
  <p style="color:var(--slate-600); max-width:420px;">{{ message }}</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary" style="margin-top:20px;"><i class="fa-solid fa-house"></i> Back to Home</a>
</div>
{% endblock %}
